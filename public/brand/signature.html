<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders email signature</title><meta name="robots" content="noindex">
<style>body{font-family:Arial,sans-serif;color:#262967;background:#fffdf8;margin:0;padding:32px 16px}main{max-width:620px;margin:0 auto}
h1{font-size:20px}ol{line-height:1.7;font-size:14px}.box{background:#fff;border:1px solid #ece4e2;border-radius:12px;padding:20px;margin:18px 0}
button{background:#e4c5e0;color:#262967;border:0;border-radius:30px;padding:10px 20px;font-weight:bold;font-size:14px;cursor:pointer}</style></head>
<body><main><h1>Orders team signature — corporate banner</h1>
<div class="box" id="sig"><a href="https://bluebellscakery.com/pages/corporate?utm_source=email_signature&amp;utm_medium=email&amp;utm_campaign=corporate" target="_blank"><img src="https://cdn.shopify.com/s/files/1/0884/4436/files/email-signature-corporate.png?v=1794260666" width="500" height="140" alt="Bluebells Corporate — ordering for work? Save 5–20% on every cake. Apply free" style="display:block;border:0;width:500px;height:140px;border-radius:14px"></a></div>
<button onclick="const r=document.createRange();r.selectNode(document.getElementById('sig'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();this.textContent='Copied ✓ — now paste into the signature'">Copy banner</button>
<ol><li>Click <b>Copy banner</b>.</li><li>Outlook → <b>Settings</b> (⚙) → <b>Account</b> → <b>Signatures</b> → choose the orders signature.</li><li>Click at the very end of the signature (under the cupcake image) and press <b>Ctrl+V</b>.</li><li><b>Save</b>.</li></ol>
</main></body></html>
